<!doctype html>
<meta charset="utf-8" />
<title>Website to Word — choose articles</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 24px 60px;
    color: #1d1d1f;
    background: #fff;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: #6b6b70; font-size: 13px; }
  #status { margin: 16px 0; font-size: 14px; }
  .toolbar {
    position: sticky; top: 0; background: #fff; padding: 12px 0;
    border-bottom: 1px solid #eee; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    z-index: 5;
  }
  .toolbar input[type="search"] { flex: 1; min-width: 160px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 7px; font-size: 13px; }
  .btn { padding: 8px 12px; font-size: 13px; border: 1px solid #ccc; background: #f6f6f8; border-radius: 7px; cursor: pointer; }
  .btn:hover { background: #eef0f4; }
  .primary { background: #2f6bff; color: #fff; border-color: #2f6bff; font-weight: 600; }
  .primary:hover { background: #1e57e6; }
  .primary:disabled { background: #9db6f2; border-color: #9db6f2; cursor: default; }
  label.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #333; }
  ul#list { list-style: none; padding: 0; margin: 14px 0 0; }
  ul#list li { display: flex; align-items: flex-start; gap: 10px; padding: 8px 6px; border-bottom: 1px solid #f0f0f2; }
  ul#list li:hover { background: #fafbff; }
  ul#list a { color: #2f6bff; text-decoration: none; font-size: 12px; }
  .title { font-size: 14px; }
  .row-url { color: #999; font-size: 11px; margin-top: 2px; word-break: break-all; }
  ul#list li.child { padding-left: 34px; }
  ul#list li.parent { background: #f7f9ff; }
  ul#list li.parent .title { font-weight: 600; }
  .badge {
    display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.03em; vertical-align: 1px;
    background: #ffeccc; color: #9a5b00;
  }
  .badge.page { background: #e6efff; color: #24479c; }
  .options { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 10px; font-size: 13px; }
  .options .group { display: flex; gap: 10px; align-items: center; padding: 6px 10px; background: #f6f6f8; border-radius: 7px; }
  .options .group > span { color: #6b6b70; font-size: 12px; }
  .note { font-size: 11px; color: #8a6d3b; background: #fdf6e3; border-radius: 6px; padding: 6px 9px; margin-top: 8px; display: none; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #ccc; border-top-color: #2f6bff; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #progressWrap { display: none; margin-top: 18px; }
  #bar { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #34c759; transition: width 0.2s; }
  #log { margin-top: 12px; font-size: 12px; max-height: 260px; overflow: auto; }
  #log div { padding: 3px 0; border-bottom: 1px solid #f4f4f4; }
  .ok { color: #1a9d4b; }
  .fail { color: #c0392b; }
  .count { font-variant-numeric: tabular-nums; }
</style>
<body>
  <h1>Website to Word</h1>
  <div class="muted" id="source"></div>

  <div id="status"><span class="spinner"></span>Scanning the page for articles…</div>

  <div id="picker" style="display:none">
    <div class="toolbar">
      <input type="search" id="filter" placeholder="Filter titles…" />
      <button class="btn" id="all">Select all</button>
      <button class="btn" id="none">Select none</button>
      <button class="btn primary" id="create">Create documents</button>
    </div>
    <div class="options">
      <div class="group">
        <span>Save as</span>
        <label class="check"><input type="checkbox" id="fmt-docx" checked /> Word</label>
        <label class="check"><input type="checkbox" id="fmt-md" /> Markdown</label>
        <label class="check"><input type="checkbox" id="fmt-pdf" /> PDF</label>
      </div>
      <div class="group">
        <label class="check"><input type="checkbox" id="combine" /> Combine into one file</label>
      </div>
      <label class="check"><input type="checkbox" id="images" checked /> Include pictures</label>
    </div>
    <div class="note" id="pdfNote">
      PDF uses a built-in generator that has no Korean or Chinese letters — those pages come out blank in PDF.
      Use Word for them.
    </div>
    <div class="muted" style="margin-top:8px"><span class="count" id="selcount">0</span> selected</div>
    <ul id="list"></ul>
  </div>

  <div id="progressWrap">
    <h1 style="font-size:16px">Creating documents…</h1>
    <div id="bar"><div></div></div>
    <div class="muted" style="margin-top:6px"><span class="count" id="pcount">0 / 0</span></div>
    <div id="log"></div>
    <button class="btn primary" id="openFolder" style="display:none;margin-top:14px">Open the folder</button>
  </div>

  <script src="selection.js"></script>
</body>
