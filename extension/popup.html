<!doctype html>
<meta charset="utf-8" />
<title>Website to Word</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    width: 300px;
    margin: 0;
    padding: 16px;
    color: #1d1d1f;
    background: #fff;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.sub { font-size: 12px; color: #666; margin: 0 0 14px; line-height: 1.4; }
  button {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: #2f6bff;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #1e57e6; }
  button:disabled { background: #9db6f2; cursor: default; }
  button.alt { background: #f6f6f8; color: #1d1d1f; border: 1px solid #ccc; }
  button.alt:hover { background: #eef0f4; }
  button.alt:disabled { background: #fafafa; color: #aaa; cursor: default; }
  .choice { margin-bottom: 14px; }
  .choice .why { font-size: 11px; color: #888; margin: 5px 2px 0; line-height: 1.4; }
  .site { font-size: 12px; color: #333; margin-top: 12px; background: #f4f6fb; padding: 8px 10px; border-radius: 6px; }
  .hint { font-size: 11px; color: #888; margin-top: 12px; line-height: 1.4; }
</style>
<body>
  <h1>Website to Word</h1>
  <p class="sub">Save web pages as Word, Markdown or PDF files.</p>

  <div class="choice">
    <button id="scan">Scan this page for articles</button>
    <p class="why">You're on a category or list page and want each article on it.</p>
  </div>

  <div class="choice">
    <button id="sources" class="alt">Save this page + its sources</button>
    <p class="why">You're on one article and also want the pages and PDFs it links to.</p>
  </div>

  <div class="site" id="site"></div>
  <p class="hint">Either way you get a checklist first, so you choose what actually gets saved.</p>
  <script src="popup.js"></script>
</body>
